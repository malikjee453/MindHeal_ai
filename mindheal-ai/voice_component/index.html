<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; }
  body { font-family:Arial,sans-serif; }
  .composer {
    width:100%; min-height:58px; display:flex; align-items:center; gap:8px;
    padding:7px 9px; background:#f0f2f6; border:1px solid #2f7655;
    border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .mic, .send {
    flex:0 0 38px; width:38px; height:40px; border:0; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .mic { color:#647d73; background:transparent; }
  .mic:hover { background:rgba(47,118,85,.09); }
  .mic[aria-pressed="true"] { color:#b42318; background:rgba(180,35,24,.10); }
  .send { color:#8b9d98; background:#e2e6ec; }
  .new-chat {
    flex:0 0 auto; height:38px; padding:0 10px; border:1px solid #d6e2da;
    border-radius:9px; color:#2f7655; background:#ffffff; font-size:12px;
    font-weight:600; white-space:nowrap; cursor:pointer;
  }
  .new-chat:hover { background:#e8f1ec; }
  .speak { color:#2f7655; background:transparent; display:none; }
  .speak.visible { display:flex; }
  .send:disabled { opacity:.65; cursor:default; }
  input {
    min-width:0; flex:1; width:100%; border:0; outline:0; background:transparent;
    color:#173b2d; font-size:14px; padding:10px 4px;
  }
  input::placeholder { color:#70877f; opacity:1; }
  svg { width:19px; height:19px; }
  #status { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
</style>
</head>
<body>
<form class="composer" id="composer" aria-label="Chat message">
  <button class="mic" id="mic" type="button" aria-label="Start voice chat" title="Tap and speak; your message sends automatically after a pause" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="2" width="6" height="13" rx="3"></rect>
      <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"></path>
    </svg>
  </button>
  <input id="message" type="text" autocomplete="off" placeholder="What's on your mind?" aria-label="Your message">
  <button class="speak mic" id="speak" type="button" aria-label="Read latest answer aloud" title="Read latest answer aloud">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path>
    </svg>
  </button>
  <button class="new-chat" id="newChat" type="button" aria-label="New chat" title="Clear this conversation and start a new chat">New Chat</button>
  <button class="send" id="send" type="submit" aria-label="Send message" title="Send message">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7"></path>
    </svg>
  </button>
</form>
<div id="status" aria-live="polite"></div>
<script>
(function () {
  const sendValue = (text) => {
    const clean = (text || "").trim();
    if (!clean) return;
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: { text: clean, id: Date.now().toString() }
    }, "*");
  };
  const form = document.getElementById("composer");
  const input = document.getElementById("message");
  const mic = document.getElementById("mic");
  const speakButton = document.getElementById("speak");
  const newChatButton = document.getElementById("newChat");
  const status = document.getElementById("status");
  let latestSpeakText = "";
  let latestSpeakLanguage = "en-US";

  function speakReply(text, lang) {
    const clean = String(text || "").trim();
    if (!clean || !("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      status.textContent = "Speech playback is not supported by this browser.";
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.lang = lang || "en-US";
    utterance.rate = 0.94;
    utterance.pitch = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const wanted = utterance.lang.toLowerCase();
    const voice = voices.find(v => v.lang.toLowerCase() === wanted)
      || voices.find(v => v.lang.toLowerCase().startsWith(wanted.split("-")[0]));
    if (voice) utterance.voice = voice;
    utterance.onerror = () => { status.textContent = "Tap the speaker icon to try playing the answer again."; };
    utterance.onend = () => { status.textContent = ""; };
    window.speechSynthesis.speak(utterance);
  }

  let language = "en-US";
  let recognition = null;
  let active = false;
  let finalText = "";
  let lastSent = "";

  speakButton.addEventListener("click", () => speakReply(latestSpeakText, latestSpeakLanguage));
  newChatButton.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    if (active && recognition) {
      try { recognition.abort(); } catch (_) {}
      recognition = null;
      setActive(false);
    }
    input.value = "";
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    // Send an explicit action to Streamlit; Python clears session chat state.
    const newChatValue = { action: "new_chat", text: "/newchat", id: "new-" + Date.now().toString() };
    // Notify Streamlit's component protocol and retain a local retry if rerun is delayed.
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: newChatValue
    }, "*");
    status.textContent = "Starting a new chat…";
    newChatButton.disabled = true;
    newChatButton.textContent = "Starting…";
    setTimeout(() => {
      newChatButton.disabled = false;
      newChatButton.textContent = "New Chat";
    }, 1800);
  });

  function setActive(on) {
    active = on;
    mic.setAttribute("aria-pressed", on ? "true" : "false");
    mic.setAttribute("aria-label", on ? "Listening; tap to cancel" : "Start voice chat");
    mic.title = on ? "Listening… pause to send automatically, or tap to cancel" : "Tap and speak; your message sends automatically after a pause";
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    lastSent = text;
    sendValue(text);
    input.value = "";
  });

  mic.addEventListener("click", () => {
    if (active && recognition) {
      try { recognition.abort(); } catch (_) {}
      recognition = null;
      setActive(false);
      status.textContent = "Voice input cancelled.";
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      status.textContent = "Speech recognition is not supported here. Try Chrome or Edge.";
      return;
    }
    finalText = "";
    recognition = new SpeechRecognition();
    recognition.lang = language;
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.onresult = (event) => {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const phrase = event.results[i][0] && event.results[i][0].transcript || "";
        if (event.results[i].isFinal) finalText += phrase + " ";
        else interim += phrase;
      }
      status.textContent = interim || finalText || "Listening";
    };
    recognition.onerror = (event) => {
      status.textContent = event.error === "not-allowed"
        ? "Please allow microphone access in your browser."
        : (event.error === "no-speech" || event.error === "aborted" ? "" : "Voice input error: " + event.error);
      setActive(false);
    };
    recognition.onend = () => {
      setActive(false);
      const transcript = finalText.trim();
      recognition = null;
      if (transcript) {
        input.value = "";
        sendValue(transcript);
      }
      status.textContent = "";
    };
    setActive(true);
    status.textContent = "Listening…";
    try { recognition.start(); }
    catch (_) { setActive(false); status.textContent = "Could not start listening. Please try again."; }
  });

  window.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type === "streamlit:render") {
      const args = data.args || {};
      language = args.language || "en-US";
      if (args.clearToken !== undefined && input.dataset.clearToken !== String(args.clearToken)) {
        input.value = "";
        input.dataset.clearToken = String(args.clearToken);
      }

      // Keep a playback fallback visible, and attempt automatic spoken replies.
      const speakText = String(args.speakText || "").trim();
      const speakId = String(args.speakId || "");
      if (speakText && speakId && input.dataset.lastSpokenId !== speakId) {
        input.dataset.lastSpokenId = speakId;
        latestSpeakText = speakText;
        latestSpeakLanguage = args.speakLanguage || language || "en-US";
        speakButton.classList.add("visible");
        speakReply(latestSpeakText, latestSpeakLanguage);
      } else if (speakText) {
        latestSpeakText = speakText;
        latestSpeakLanguage = args.speakLanguage || language || "en-US";
        speakButton.classList.add("visible");
      }
    }
  });
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:62},"*");
})();
</script>
</body>
</html>
